services:
  api:
    build: .
    ports:
      - 3000:3000
    depends_on:
      test-db:
        condition: service_healthy
    env_file:
      - ".env.test"

  test-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ecommerce_test" ]
      interval: 5s
      timeout: 5s
      retries: 5
